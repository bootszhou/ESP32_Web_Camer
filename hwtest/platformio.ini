[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; N16R8: 16MB quad flash + 8MB octal PSRAM
; f_flash capped at 40MHz: the factory bootloader ran at div:2 (40MHz) and the
; board booted reliably that way. 80MHz (div:1) caused a boot loop after a
; full erase replaced the factory bootloader.
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

; esp32-camera: Arduino-ESP32 2.x ships it as a preinstalled lib for this
; platform, so no external dependency is required here.
lib_deps =

