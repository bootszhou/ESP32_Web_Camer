map $http_upgrade $camai_upgrade {
    default upgrade;
    ''      close;
}

# Login is served by the relay itself (single source of truth for the cookie).
# Everything else on 443 needs a session; nginx asks the relay via auth_request.
server {
    listen 443 ssl;
    http2 on;
    server_name 47.103.200.7;

    ssl_certificate     /etc/cam-ai/tls/server.crt;
    ssl_certificate_key /etc/cam-ai/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:camai_ssl:10m;
    ssl_session_timeout 1h;

    access_log /var/log/cam-ai/nginx-access.log;
    error_log  /var/log/cam-ai/nginx-error.log warn;

    client_max_body_size 2m;
    server_tokens off;

    # ---- session check -----------------------------------------------------
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:9000/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # ---- login -------------------------------------------------------------
    location = /login {
        proxy_pass http://127.0.0.1:9000/login;
        proxy_set_header Host $host;
    }
    location = /logout {
        proxy_pass http://127.0.0.1:9000/logout;
    }

    # ---- public bits -------------------------------------------------------
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:9000/health;
    }
    location = /ca.crt {
        alias /var/www/cam-ai/camai-root-ca.crt;
        default_type application/x-x509-ca-cert;
    }
    location = /favicon.ico { return 204; }

    # ---- the device LAN page, tunnelled -----------------------------------
    # Served from the device's own httpd so every button, dialog and endpoint
    # is byte-identical to the LAN experience. The only edit is the injected
    # stream base, which points the <img> at /dev81 (same origin, so no mixed
    # content and no second port to expose).
    location = / {
        auth_request /_auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:9000/dev80/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        sub_filter_once on;
        sub_filter '</head>' '<script>window.__CAMAI_STREAM_BASE="/dev81";</script></head>';
    }

    # The page addresses its API with absolute paths, so the same prefixes have
    # to exist at the top level. /motion and /snapshot are <img> sources.
    location /api/ {
        auth_request /_auth;
        proxy_pass http://127.0.0.1:9000/dev80/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /motion {
        auth_request /_auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:9000/dev80/motion;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /snapshot {
        auth_request /_auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:9000/dev80/snapshot;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # ---- stream / replay (device port 81) ---------------------------------
    location /dev81/ {
        auth_request /_auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:9000/dev81/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Legacy MJPEG endpoint kept so an old bookmark or the phone shortcut still
    # works; it is session-protected now instead of Basic auth.
    location = /stream.mjpeg {
        auth_request /_auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:9000/stream.mjpeg;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---- device reverse channel -------------------------------------------
    location /devices/ {
        proxy_pass http://127.0.0.1:9000/devices/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $camai_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location @need_login {
        return 302 /login;
    }

    location / { return 404; }
}
